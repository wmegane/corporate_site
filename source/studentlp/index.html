    <h1>【ダミー】OfferBox 卒年選択ページ (offerbox.jp/studentlp)</h1>
    <p>キャリアパークから「画面を挟む遷移」で最初に着地するページです。</p>
    <p>URLパラメータに <code>cp_uid</code> が含まれている場合、Cookie（.offerbox.jp）に保存されます。</p>

    <hr />

    <div style="margin: 20px 0">
      <button
        id="btn-next"
        style="
          padding: 15px 30px;
          font-weight: bold;
          background-color: #007bff;
          color: white;
          border: none;
          cursor: pointer;
          margin-right: 10px;
        "
      >
        27年卒フォームへ進む (app.offerbox.jp側のフォームへ)
      </button>

      <button
        id="btn-alert"
        style="
          padding: 15px 30px;
          font-weight: bold;
          background-color: #6c757d;
          color: white;
          border: none;
          cursor: pointer;
        "
      >
        28年卒フォーム（遷移しません。アラート出すだけ。）
      </button>
    </div>

    <script>
      // ボタン1: 別サブドメインのフォーム画面へ遷移
      // ※このときURLに cp_uid は引き継がない本番通りの挙動にします
      document.getElementById('btn-next').addEventListener('click', function () {
        window.location.href = 'https://app.wmegane.com/sadduser/1883/';
      });

      // ボタン2: 指定のアラートダイアログを表示
      document.getElementById('btn-alert').addEventListener('click', function () {
        alert('28卒クリック');
      });
    </script>
